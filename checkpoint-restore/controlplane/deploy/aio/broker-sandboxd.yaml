apiVersion: apps/v1
kind: Deployment
metadata:
  name: aio-sandbox-broker-sandboxd
  namespace: default
  labels: { app: aio-sandbox-broker-sandboxd }
spec:
  replicas: 2
  selector:
    matchLabels: { app: aio-sandbox-broker-sandboxd }
  template:
    metadata:
      labels: { app: aio-sandbox-broker-sandboxd }
    spec:
      containers:
        - name: broker
          image: 111122223333.dkr.ecr.us-west-2.amazonaws.com/aio-sandbox-broker-sandboxd:v1
          env:
            # --- Pool / workload ---
            # SINGLE-app modes:
            #   DEDICATED pool (its SandboxTemplate pins an image): set SANDBOXD_POOL only.
            #   GENERIC pool (image-less template): SANDBOXD_POOL=<generic> + SANDBOXD_APP=<AppTemplate>.
            # MULTI-app mode (docs/PRD-broker-multi-app.md): set SANDBOXD_APPS, a JSON
            #   registry of app-id -> {appTemplate, pool, group}. The app-id arrives per
            #   request in X-Sandbox-App (injected by an agentgateway per-app route); the
            #   broker maps it -> pool + AppTemplate and ENFORCES the app's group. When
            #   SANDBOXD_APPS is set, SANDBOXD_POOL/SANDBOXD_APP are the legacy fallback
            #   (ignored). SANDBOXD_DEFAULT_APP fills a missing X-Sandbox-App.
            - { name: SANDBOXD_POOL, value: aio-generic-pool }
            - name: SANDBOXD_APPS
              value: |
                {"aio":{"appTemplate":"aio-app","pool":"aio-generic-pool","group":"sandbox-users"},
                 "everything":{"appTemplate":"everything-app","pool":"aio-generic-pool","group":"sandbox-power"}}
            - { name: SANDBOXD_DEFAULT_APP, value: aio }
            - { name: SANDBOXD_ROUTER_URL, value: "http://sandboxd-router.sandboxd-controlplane-system.svc.cluster.local:8080" }
            # --- OIDC (MUST be set explicitly) ---
            # The broker validates the passed-through Keycloak JWT as a resource server.
            # These have safe placeholder DEFAULTS in code (keycloak.example.com) that will
            # REJECT every real token, so they MUST be set here to your environment — do NOT
            # rely on the code default. Issuer must match agentgateway's issuer exactly.
            - { name: AIO_OIDC_ISSUER, value: "https://keycloak.example.com/realms/sandbox" }   # REPLACE with your Keycloak realm issuer
            - { name: AIO_EXPECTED_AUDIENCE, value: "sandbox-router" }
            - { name: AIO_GATEWAY_AZP, value: "aio-sandbox-client" }
            - { name: AIO_REQUIRED_GROUP, value: "sandbox-users" }
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
