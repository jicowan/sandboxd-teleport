apiVersion: core.sandboxd.io/v1alpha1
kind: SandboxTemplate
metadata: { name: aio, namespace: default }
spec:
  image: ghcr.io/agent-infra/sandbox:latest
  ports: [{ container: 8080, host: 8080 }]
  health: { probe: http, probePort: 8080, probePath: /v1/health }
  idle: { timeoutSeconds: 600, action: suspend }
  # Per-pool: surface the nested AIO workload's stdout/stderr to the worker's
  # `kubectl logs` (sets SANDBOXD_STREAM_CONSOLE=1 on THIS pool's workers only).
  # Off by default; opt-in here for debuggability. The console is attacker-
  # controlled, so sandboxd prefixes/sanitizes/caps it; the session-scoped /logs
  # API stays the production path.
  streamConsole: true
  # Per-pool worker-image override (canary). The worker image carries the pinned
  # runsc that checkpoint/restore depends on; keep it aligned across pools you
  # teleport between. Omit to use the operator's global --worker-image default.
  workerImage: 111122223333.dkr.ecr.us-west-2.amazonaws.com/sandboxd:v42
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
  scheduling:
    nodeSelector: { sandbox: gvisor }
    tolerations: [{ key: sandbox, operator: Equal, value: gvisor, effect: NoSchedule }]
    topologySpreadConstraints:
      - { maxSkew: 1, minDomains: 2, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { sandboxd.io/app: worker, sandboxd.io/pool: aio-pool } } }
---
apiVersion: core.sandboxd.io/v1alpha1
kind: WarmPool
metadata: { name: aio-pool, namespace: default }
spec: { templateRef: { name: aio }, replicas: 4, minIdle: 2 }
