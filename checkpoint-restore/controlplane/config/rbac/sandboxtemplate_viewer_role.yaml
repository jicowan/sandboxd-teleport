# This rule is not used by the project sandboxd-controlplane itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to core.sandboxd.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sandboxd-controlplane
    app.kubernetes.io/managed-by: kustomize
  name: sandboxtemplate-viewer-role
rules:
- apiGroups:
  - core.sandboxd.io
  resources:
  - sandboxtemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - core.sandboxd.io
  resources:
  - sandboxtemplates/status
  verbs:
  - get
