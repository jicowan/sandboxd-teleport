---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.sandboxd.io
  resources:
  - basesnapshots
  - forksets
  - sessions
  - warmpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.sandboxd.io
  resources:
  - basesnapshots/finalizers
  - forksets/finalizers
  - warmpools/finalizers
  verbs:
  - update
- apiGroups:
  - core.sandboxd.io
  resources:
  - basesnapshots/status
  - forksets/status
  - sessions/status
  - warmpools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - core.sandboxd.io
  resources:
  - sandboxtemplates
  verbs:
  - get
  - list
  - watch
