---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: basesnapshots.core.sandboxd.io
spec:
  group: core.sandboxd.io
  names:
    kind: BaseSnapshot
    listKind: BaseSnapshotList
    plural: basesnapshots
    shortNames:
    - basesnap
    singular: basesnapshot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.refCount
      name: Refs
      type: integer
    - jsonPath: .spec.pinned
      name: Pinned
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BaseSnapshot is the Schema for the basesnapshots API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired base snapshot
            properties:
              pinned:
                description: |-
                  pinned keeps the base indefinitely: while true it is never auto-reclaimed even
                  when refCount reaches 0. Set false to let the base be reclaimed once unreferenced.
                type: boolean
              sourceSessionRef:
                description: |-
                  sourceSessionRef names a SUSPENDED Session whose current snapshot is promoted
                  to this base. (Increment 2 supports promoting an already-suspended session; a
                  checkpoint-a-live-session mode is a follow-up.)
                properties:
                  name:
                    description: name of the referenced object.
                    type: string
                required:
                - name
                type: object
            required:
            - sourceSessionRef
            type: object
          status:
            description: status defines the observed state
            properties:
              conditions:
                description: conditions represent the current state of the BaseSnapshot
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              health:
                description: Health describes how the worker probes the sandbox and
                  how it restarts it.
                properties:
                  probe:
                    description: probe type used to determine readiness.
                    enum:
                    - none
                    - tcp
                    - http
                    type: string
                  probePath:
                    description: probePath is the HTTP path to probe (http probe only).
                    type: string
                  probePort:
                    description: probePort is the interior container port to probe.
                    type: integer
                  restartPolicy:
                    description: restartPolicy on unexpected sandbox exit.
                    enum:
                    - none
                    - cold
                    - restore
                    type: string
                type: object
              iamRoleArn:
                type: string
              image:
                description: |-
                  The resolved restore identity, copied from the source session at promote time
                  so forks are self-describing.
                type: string
              phase:
                description: phase is the base lifecycle state.
                enum:
                - Pending
                - Ready
                - Reclaimed
                - Failed
                type: string
              ports:
                items:
                  description: PortMap maps a worker pod port to a sandbox container
                    port (DNAT).
                  properties:
                    container:
                      description: container is the port the sandbox process listens
                        on.
                      maximum: 65535
                      minimum: 1
                      type: integer
                    host:
                      description: host is the port on the worker pod IP. 0 defaults
                        to container.
                      maximum: 65535
                      minimum: 0
                      type: integer
                  required:
                  - container
                  type: object
                type: array
              ready:
                description: ready is true once the base is forkable (copy-on-promote
                  complete).
                type: boolean
              refCount:
                description: |-
                  refCount is the number of holds keeping the base alive: forks that have not yet
                  completed their first restore, plus explicit pins. A fork needs the base only
                  for its first restore, so this drops as forks materialize. Reclaim is eligible
                  only when pinned==false AND refCount==0 (docs/PRD-snapshot-fork.md §5.4).
                format: int32
                type: integer
              runscVersion:
                type: string
              snapshotURI:
                description: |-
                  snapshotURI is the fork-stable S3 prefix (bases/<name>/snap-…) the base was
                  copied to. Set once copy-on-promote completes.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
