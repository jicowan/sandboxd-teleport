---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sessions.core.sandboxd.io
spec:
  group: core.sandboxd.io
  names:
    kind: Session
    listKind: SessionList
    plural: sessions
    shortNames:
    - sess
    singular: session
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.workerPodIP
      name: Worker
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Session is the Schema for the sessions API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Session
            properties:
              cmd:
                description: cmd overrides the entrypoint for arbitrary-image mode.
                items:
                  type: string
                type: array
              env:
                description: env for arbitrary-image mode.
                items:
                  type: string
                type: array
              iam:
                description: |-
                  iam optionally lets this session's sandbox assume an AWS IAM role, overriding
                  the pool template's iam. Authorization is enforced at the front door / control
                  plane before the Session is created.
                properties:
                  roleArn:
                    description: |-
                      roleArn is the ARN of the IAM role the sandbox may assume. Authorization for
                      which sessions may use which role is enforced at the front door / control
                      plane, not here.
                    type: string
                type: object
              image:
                description: |-
                  image is a caller-supplied arbitrary image (arbitrary-image mode, O6):
                  authz-gated at the front door before creation. Mutually exclusive with
                  poolRef. When set, cmd/env/ports may accompany it.
                type: string
              lifecycle:
                description: lifecycle overrides template idle/TTL for this session.
                properties:
                  idleTimeoutSeconds:
                    description: idleTimeoutSeconds overrides the template idle timeout.
                    type: integer
                  ttlAfterSuspendSeconds:
                    description: |-
                      ttlAfterSuspendSeconds is how long the S3 checkpoint is retained after
                      suspend before GC.
                    type: integer
                type: object
              poolRef:
                description: poolRef selects a WarmPool (template mode). Mutually
                  exclusive with image.
                properties:
                  name:
                    description: name of the referenced object.
                    type: string
                required:
                - name
                type: object
              ports:
                description: ports for arbitrary-image mode.
                items:
                  description: PortMap maps a worker pod port to a sandbox container
                    port (DNAT).
                  properties:
                    container:
                      description: container is the port the sandbox process listens
                        on.
                      maximum: 65535
                      minimum: 1
                      type: integer
                    host:
                      description: host is the port on the worker pod IP. 0 defaults
                        to container.
                      maximum: 65535
                      minimum: 0
                      type: integer
                  required:
                  - container
                  type: object
                type: array
              subject:
                description: |-
                  subject is the opaque identity the router matches the JWT-derived subject
                  against (O4).
                type: string
            type: object
          status:
            description: status defines the observed state of Session
            properties:
              conditions:
                description: conditions represent the current state of the Session
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              image:
                description: image is the resolved image (recorded for restore identity).
                type: string
              lastActiveAt:
                description: lastActiveAt is the last request time stamped by the
                  router (O3).
                format: date-time
                type: string
              phase:
                description: phase mirrors the KV session state.
                enum:
                - Absent
                - Running
                - Suspending
                - Suspended
                - Resuming
                type: string
              snapshotURI:
                description: snapshotURI is the current checkpoint location (set once
                  one exists).
                type: string
              workerPodIP:
                description: workerPodIP is set while Running/Resuming.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
