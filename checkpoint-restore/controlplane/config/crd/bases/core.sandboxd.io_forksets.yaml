---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: forksets.core.sandboxd.io
spec:
  group: core.sandboxd.io
  names:
    kind: ForkSet
    listKind: ForkSetList
    plural: forksets
    shortNames:
    - fork
    singular: forkset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.desired
      name: Desired
      type: integer
    - jsonPath: .status.ready
      name: Ready
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ForkSet is the Schema for the forksets API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired fan-out
            properties:
              activation:
                default: Lazy
                description: |-
                  activation controls whether forks are materialized immediately (Eager -
                  resume/run all N now) or lazily on first contact (Lazy). Default Lazy.
                enum:
                - Eager
                - Lazy
                type: string
              appRef:
                description: |-
                  appRef optionally names an AppTemplate the image-source children cold-start from,
                  so a ForkSet can fan out onto a GENERIC pool (whose SandboxTemplate pins no
                  image). Mutually exclusive with baseRef. When both baseRef and appRef are unset,
                  this is an image-source ForkSet on a DEDICATED pool (children cold-start from the
                  pool's own SandboxTemplate image). See docs/PRD-arbitrary-image-sessions.md §13.6.
                properties:
                  name:
                    description: name of the referenced object.
                    type: string
                required:
                - name
                type: object
              baseRef:
                description: |-
                  baseRef optionally selects the BaseSnapshot to fork from (snapshot source).
                  When set, children are restored from the base's snapshot. It carries its own
                  image, so a snapshot-source ForkSet works on any pool. Mutually exclusive with
                  appRef.
                properties:
                  name:
                    description: name of the referenced object.
                    type: string
                required:
                - name
                type: object
              count:
                description: |-
                  count is the number of fork children (N) to create.

                  The maximum is the operator's ABSOLUTE, bypass-proof fan-out guardrail
                  (docs/PRD-snapshot-fork.md §6): a hard cap enforced by the apiserver via the
                  CRD schema, so it holds for EVERY caller — a direct `kubectl apply` as much as
                  the example broker. It bounds blast radius (one ForkSet = up to N workers). It
                  is intentionally a fixed cap, not per-subject quota: per-identity limits are
                  the CALLER's job (the broker's fork_session), which the operator cannot and
                  does not enforce here.
                format: int32
                maximum: 256
                minimum: 1
                type: integer
              iam:
                description: |-
                  iam optionally lets each fork's sandbox assume an AWS IAM role, overriding the
                  base's / template's iam.
                properties:
                  roleArn:
                    description: |-
                      roleArn is the ARN of the IAM role the sandbox may assume. Authorization for
                      which sessions may use which role is enforced at the front door / control
                      plane, not here.
                    type: string
                type: object
              lifecycle:
                description: |-
                  lifecycle sets the per-fork idle policy (ephemeral reset vs durable suspend)
                  and retention, applied to every child Session.
                properties:
                  idleAction:
                    description: |-
                      idleAction overrides the template idle action for this session: suspend
                      (checkpoint->S3, free worker), reset (discard state, free worker), or none.
                      Lets an ephemeral fork choose reset-on-idle without a dedicated pool
                      (docs/PRD-snapshot-fork.md §5.3). Empty = inherit the template's action.
                    enum:
                    - suspend
                    - reset
                    - none
                    type: string
                  idleTimeoutSeconds:
                    description: idleTimeoutSeconds overrides the template idle timeout.
                    type: integer
                  ttlAfterSuspendSeconds:
                    description: |-
                      ttlAfterSuspendSeconds is how long the S3 checkpoint is retained after
                      suspend before GC.
                    type: integer
                type: object
              namePrefix:
                description: |-
                  namePrefix gives fork children deterministic names (sess-fork-<prefix>-<n>) so
                  a harness can address a specific fork. When empty, a generated suffix is used.
                type: string
              pool:
                description: |-
                  pool places the forks and, for the image source, supplies the template image.
                  Required for the image source; for the snapshot source it must be
                  runsc-compatible with the base.
                type: string
              subject:
                description: subject is the owner identity for fan-out quota + attribution.
                type: string
            required:
            - count
            - pool
            type: object
          status:
            description: status defines the observed fan-out state
            properties:
              conditions:
                description: conditions represent the current state of the ForkSet
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desired:
                description: desired is the number of fork children requested (mirrors
                  spec.count).
                format: int32
                type: integer
              forks:
                description: |-
                  forks is the list of created child session ids — what a harness reads back to
                  address each fork.
                items:
                  type: string
                type: array
              phase:
                description: phase is the fan-out state.
                enum:
                - Progressing
                - Ready
                - Failed
                type: string
              ready:
                description: ready is the number of fork children whose Session has
                  reached Running.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
