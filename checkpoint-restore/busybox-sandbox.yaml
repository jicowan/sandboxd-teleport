# A minimal stateful gVisor Sandbox for the checkpoint/restore orchestrator spike.
# busybox workload: increments an in-RAM counter every 2s and appends it to a
# state file on disk. Proves RAM + FS continuity across checkpoint/restore.
apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: busybox-ckpt
  namespace: default
spec:
  podTemplate:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"     # don't let Karpenter evict mid-spike
    spec:
      runtimeClassName: gvisor                    # -> pause+workload run under runsc; scheduling pins gvisor node
      restartPolicy: OnFailure
      containers:
        - name: counter
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              n=0
              mkdir -p /state
              echo "boot $(date -u +%FT%TZ)" >> /state/log
              while true; do
                n=$((n+1))
                echo "count=$n at $(date -u +%FT%TZ)" >> /state/log
                echo "in-ram counter=$n"
                sleep 2
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 256Mi
