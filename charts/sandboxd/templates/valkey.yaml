apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: valkey
    {{- include "sandboxd.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey }
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          args: ["--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
          ports: [{ containerPort: 6379, name: valkey }]
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandboxd.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports: [{ port: 6379, targetPort: 6379 }]
