# Operator ServiceAccount + the manager-role ClusterRole (mirrors
# config/rbac/role.yaml) + bindings, and the leader-election Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.operator.serviceAccount | default "sandboxd-operator" }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandboxd.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-manager-role
  labels: {{- include "sandboxd.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [core.sandboxd.io]
    resources: [apptemplates, sandboxtemplates]
    verbs: [get, list, watch]
  - apiGroups: [core.sandboxd.io]
    resources: [basesnapshots, forksets, sessions, warmpools]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [core.sandboxd.io]
    resources: [basesnapshots/finalizers, forksets/finalizers, sessions/finalizers, warmpools/finalizers]
    verbs: [update]
  - apiGroups: [core.sandboxd.io]
    resources: [basesnapshots/status, forksets/status, sessions/status, warmpools/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-manager-rolebinding
  labels: {{- include "sandboxd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.operator.serviceAccount | default "sandboxd-operator" }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-leaderelection
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandboxd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-leaderelection
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sandboxd.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-leaderelection
subjects:
  - kind: ServiceAccount
    name: {{ .Values.operator.serviceAccount | default "sandboxd-operator" }}
    namespace: {{ .Release.Namespace }}
