                    - suspend
                    - reset
                    - none
                    type: string
                  timeoutSeconds:
                    default: 300
                    description: timeoutSeconds of inactivity before the action fires.
                      0 = never auto-suspend.
                    minimum: 0
                    type: integer
                type: object
