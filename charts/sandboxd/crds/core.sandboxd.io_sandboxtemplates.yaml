                  probe:
                    description: probe type used to determine readiness.
                    enum:
                    - none
                    - tcp
                    - http
                    type: string
                  probePath:
                    description: probePath is the HTTP path to probe (http probe only).
                    type: string
                  probePort:
                    description: probePort is the interior container port to probe.
                    type: integer
                  restartPolicy:
                    description: restartPolicy on unexpected sandbox exit.
                    enum:
                    - none
                    - cold
                    - restore
                    type: string
                type: object
