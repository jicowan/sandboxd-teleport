{{- if .Values.broker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandboxd-broker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sandboxd-broker
    {{- include "frontdoor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.broker.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: sandboxd-broker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sandboxd-broker }
    spec:
      {{- if .Values.waitForDependencies.enabled }}
      initContainers:
        # The broker forwards MCP to the router — don't start before it's reachable.
        {{- include "frontdoor.waitForTCP" (dict "name" "wait-for-router" "image" .Values.waitForDependencies.image "deps" (list (printf "%s.%s.svc.cluster.local:%v" .Values.controlPlane.routerService .Values.controlPlane.namespace (.Values.controlPlane.routerPort | int)))) | nindent 8 }}
        {{- if .Values.keycloak.deploy }}
        {{- if .Values.keycloak.discoveryHost }}
        # Bundled Keycloak: TCP-gate on the in-cluster Keycloak host:port (avoids
        # busybox wget TLS/DNS issues probing the external issuer URL).
        {{- include "frontdoor.waitForTCP" (dict "name" "wait-for-keycloak" "image" .Values.waitForDependencies.image "deps" (list .Values.keycloak.discoveryHost)) | nindent 8 }}
        {{- else }}
        # Bundled Keycloak, no discoveryHost: gate on OIDC discovery over the
        # issuer URL so JWKS is actually serving before the broker starts.
        {{- include "frontdoor.waitForHttp" (dict "name" "wait-for-oidc" "image" .Values.waitForDependencies.image "url" (printf "%s/.well-known/openid-configuration" (include "frontdoor.issuer" .))) | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: broker
          image: {{ include "frontdoor.brokerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # --- Pool / workload registry (multi-app mode) ---
            - name: SANDBOXD_APPS
              value: {{ include "frontdoor.appsJson" . | quote }}
            - { name: SANDBOXD_DEFAULT_APP, value: {{ .Values.defaultApp | quote }} }
            - { name: SANDBOXD_ROUTER_URL, value: {{ include "frontdoor.routerUrl" . | quote }} }
            - { name: AIO_MCP_PROTOCOL_VERSION, value: {{ .Values.broker.mcpProtocolVersion | quote }} }
            # --- OIDC (shared with agentgateway + realm; MUST agree) ---
            - { name: AIO_OIDC_ISSUER, value: {{ include "frontdoor.issuer" . | quote }} }
            - { name: AIO_EXPECTED_AUDIENCE, value: {{ .Values.oidc.audience | quote }} }
            - { name: AIO_GATEWAY_AZP, value: {{ .Values.oidc.azp | quote }} }
            - { name: AIO_REQUIRED_GROUP, value: {{ .Values.oidc.requiredGroup | quote }} }
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources: {{- toYaml .Values.broker.resources | nindent 12 }}
---
# Broker Service — agentgateway is the ONLY thing that should reach this.
# Do not put a public ingress in front of it (that would bypass the tool allowlist).
apiVersion: v1
kind: Service
metadata:
  name: sandboxd-broker
  namespace: {{ .Release.Namespace }}
  labels: {{- include "frontdoor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.broker.service.type }}
  selector: { app.kubernetes.io/name: sandboxd-broker }
  ports:
    - { port: {{ .Values.broker.service.port }}, targetPort: 8080, name: http }
{{- end }}
