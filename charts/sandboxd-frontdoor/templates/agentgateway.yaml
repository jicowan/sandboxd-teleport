{{- if .Values.agentgateway.enabled }}
{{- $root := . -}}
{{- $issuer := include "frontdoor.issuer" . -}}
{{- $jwks := include "frontdoor.jwksUrl" . -}}
{{- $brokerHost := printf "http://%s:%v/" (include "frontdoor.brokerHost" .) (.Values.broker.service.port | int) -}}
{{- $resourceBase := printf "https://%s" .Values.publicHost -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "frontdoor.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Generated by the sandboxd-frontdoor chart. One route PAIR per app:
    #   - a well-known route (RFC 9728 OAuth discovery, no token required)
    #   - a data route that injects X-Sandbox-App and applies the tool allowlist.
    # There is no catch-all "/" route, so per-app discovery is unambiguous.
    binds:
    - port: {{ .Values.agentgateway.port }}
      listeners:
      - protocol: HTTP
        routes:
        {{- range .Values.apps }}
        # ---- App: {{ .id }} — OAuth protected-resource discovery ----
        - name: {{ .id }}-wellknown
          matches: [{ path: { pathPrefix: /.well-known/oauth-protected-resource/{{ .id }} } }]
          policies:
            mcpAuthentication:
              mode: strict
              issuer: {{ $issuer }}
              audiences: [{{ $root.Values.oidc.audience }}]
              jwks: { url: {{ $jwks }} }
              provider: { keycloak: {} }
              resourceMetadata:
                resource: {{ $resourceBase }}/{{ .id }}/mcp
                authorization_servers: [{{ $issuer }}]
                scopesSupported: {{ $root.Values.oidc.scopes | toJson }}
                bearerMethodsSupported: [header]
            backendAuth: { passthrough: {} }
          backends:
          - mcp: { targets: [{ name: {{ .id }}-broker, mcp: { host: {{ $brokerHost }} } }] }
        # ---- App: {{ .id }} — data path /{{ .id }}/mcp ----
        - name: {{ .id }}-route
          matches: [{ path: { pathPrefix: /{{ .id }} } }]
          policies:
            mcpAuthentication:
              mode: strict
              issuer: {{ $issuer }}
              audiences: [{{ $root.Values.oidc.audience }}]
              jwks: { url: {{ $jwks }} }
              provider: { keycloak: {} }
              resourceMetadata:
                resource: {{ $resourceBase }}/{{ .id }}/mcp
                authorization_servers: [{{ $issuer }}]
                scopesSupported: {{ $root.Values.oidc.scopes | toJson }}
                bearerMethodsSupported: [header]
            backendAuth: { passthrough: {} }
            requestHeaderModifier: { set: { X-Sandbox-App: {{ .id }} } }
            {{- with .authzRules }}
            mcpAuthorization:
              rules:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
          backends:
          - mcp: { targets: [{ name: {{ .id }}-broker, mcp: { host: {{ $brokerHost }} } }] }
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentgateway
    {{- include "frontdoor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agentgateway.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: agentgateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agentgateway }
      {{- if .Values.agentgateway.doNotDisrupt }}
      annotations: { karpenter.sh/do-not-disrupt: "true" }
      {{- end }}
    spec:
      {{- if and .Values.waitForDependencies.enabled .Values.broker.enabled }}
      initContainers:
        # agentgateway proxies to the broker — don't start before it's reachable.
        {{- include "frontdoor.waitForTCP" (dict "name" "wait-for-broker" "image" .Values.waitForDependencies.image "deps" (list (printf "%s:%v" (include "frontdoor.brokerHost" .) (.Values.broker.service.port | int)))) | nindent 8 }}
      {{- end }}
      dnsConfig:
        options:
          - { name: ndots, value: {{ .Values.agentgateway.ndots | quote }} }
      containers:
        - name: agentgateway
          image: {{ .Values.agentgateway.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-f", "/etc/agentgateway/config.yaml"]
          ports:
            - { name: http, containerPort: {{ .Values.agentgateway.port }} }
          volumeMounts:
            - { name: cfg, mountPath: /etc/agentgateway }
          resources: {{- toYaml .Values.agentgateway.resources | nindent 12 }}
      volumes:
        - name: cfg
          configMap: { name: agentgateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "frontdoor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.agentgateway.service.type }}
  selector: { app.kubernetes.io/name: agentgateway }
  ports:
    - { name: http, port: {{ .Values.agentgateway.service.port }}, targetPort: {{ .Values.agentgateway.port }} }
{{- if .Values.agentgateway.ingress.enabled }}
---
# Public, internet-facing ALB. TLS terminates at the ALB (needs AWS Load
# Balancer Controller). Point a DNS alias for publicHost at the ALB after apply.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "frontdoor.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.agentgateway.ingress.scheme }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: {{ required "agentgateway.ingress.certificateArn is required when ingress is enabled" .Values.agentgateway.ingress.certificateArn }}
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: {{ .Values.agentgateway.port | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /.well-known/oauth-protected-resource/{{ .Values.defaultApp }}/mcp
    alb.ingress.kubernetes.io/success-codes: "200"
    {{- with .Values.agentgateway.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.agentgateway.ingress.className }}
  rules:
    - host: {{ .Values.publicHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: {{ .Values.agentgateway.service.port }}
{{- end }}
{{- end }}
