# Internal ALB for the broker MCP endpoint.
#
# The broker is NOT public. AgentCore Gateway reaches it privately via its
# MCPServer `privateEndpoint` (VPC/subnets/SG), so an internal-scheme ALB is
# correct — matching the reference alphavantage MCP target. TLS still
# terminates at the ALB (the Gateway speaks HTTPS to the target).
#
# Healthcheck is /healthz (the broker's own endpoint; the Stage-1 /ping was
# the oauth2-proxy sidecar, which Stage 2 removes).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aio-sandbox-broker
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:820537372947:certificate/512d4375-500e-4854-808e-6d645a65aef6
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: broker.jicomusic.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aio-sandbox-broker-svc
                port:
                  number: 8080
