# The broker holds the ONLY identity allowed to create/delete SandboxClaims.
# This is the RBAC that used to live on every client's kubeconfig.
#
# Scoped to a single namespace (Role, not ClusterRole). If the broker ever
# needs to manage sandboxes across namespaces, promote to a ClusterRole +
# ClusterRoleBinding — but keep it namespace-scoped while you can.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aio-sandbox-broker
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aio-sandbox-broker
  namespace: default
rules:
  # Lifecycle of claims: create on POST /sessions, delete on DELETE.
  # get/list/watch because the SDK watches the claim until the sandbox
  # name resolves (create_sandbox) and reads it back (get_sandbox).
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "delete", "get", "list", "watch"]
  # Read-only on the bound Sandbox object — get_sandbox resolves and
  # verifies the underlying sandbox; it never mutates it.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aio-sandbox-broker
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aio-sandbox-broker
subjects:
  - kind: ServiceAccount
    name: aio-sandbox-broker
    namespace: default
