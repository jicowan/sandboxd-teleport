# Public, internet-facing ALB for agentgateway so Claude Code (on a laptop)
# can reach the per-app MCP endpoints. TLS terminates at the ALB.
#
# After apply, point a Route53 alias agentgateway.example.com -> the ALB.
# Claude Code reaches a per-app endpoint, e.g. https://agentgateway.example.com/aio/mcp
# (or /everything/mcp). There is no catch-all /mcp endpoint (see deploy/30-agentgateway.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # Replace with your own ACM certificate ARN for the public hostname.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:111122223333:certificate/REPLACE_WITH_YOUR_CERT_ID
    # Health-check the agentgateway MCP listener (port 3000) on a real route. Use
    # an app's OAuth protected-resource discovery path — it needs no token and
    # returns 200 (a data path like /aio/mcp would 401 without a bearer token).
    alb.ingress.kubernetes.io/healthcheck-port: "3000"
    alb.ingress.kubernetes.io/healthcheck-path: /.well-known/oauth-protected-resource/aio/mcp
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: agentgateway.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway-svc
                port:
                  number: 3000
