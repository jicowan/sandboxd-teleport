# Public, internet-facing ALB for agentgateway so Claude Code (on a laptop)
# can reach the MCP endpoint. TLS terminates at the ALB.
#
# After apply, point a Route53 alias agentgateway.example.com -> the ALB.
# Claude Code reaches: https://agentgateway.example.com/mcp
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # Replace with your own ACM certificate ARN for the public hostname.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:111122223333:certificate/REPLACE_WITH_YOUR_CERT_ID
    # agentgateway serves MCP at /mcp; the broker health path differs, so
    # health-check the agentgateway readiness port (15021) is internal — use
    # the MCP listener port and a path that returns quickly.
    alb.ingress.kubernetes.io/healthcheck-port: "3000"
    alb.ingress.kubernetes.io/healthcheck-path: /mcp
    alb.ingress.kubernetes.io/success-codes: "200,400,401,406"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: agentgateway.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway-svc
                port:
                  number: 3000
