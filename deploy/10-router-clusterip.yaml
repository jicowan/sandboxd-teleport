# Stage 2 router posture: NO oauth2-proxy sidecar.
#
# In Stage 2, authentication/authorization happen upstream of the router:
#   - AgentCore Gateway (inbound user OAuth)
#   - the broker (validates the OBO token, enforces the sandbox-users group)
# The broker is the ONLY caller of the router, over plain in-cluster HTTP.
# So the router's sidecar is redundant and is removed here.
#
# SAFETY: removing the sidecar means the router is no longer
# authenticated-at-the-edge. It MUST therefore be ClusterIP-only — the public
# `sandbox-router` Ingress is deleted (see note below). Reachable only by the
# broker inside the cluster.
#
# Apply as a full replace of the deployment's pod spec containers, then patch
# the Service and delete the Ingress:
#   kubectl apply -f 40-router-stage2.yaml
#   kubectl patch svc/sandbox-router-svc -n default --type=json \
#     -p='[{"op":"replace","path":"/spec/ports/0/targetPort","value":8080}]'
#   kubectl delete ingress -n default sandbox-router
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router-deployment
  namespace: default
spec:
  template:
    spec:
      # Drop the sidecar by declaring the desired container set explicitly.
      # (A strategic-merge patch can't remove a container; apply the full
      # containers list. The router image/env are otherwise unchanged.)
      containers:
        - name: router
          # Rebind to 0.0.0.0 so the ClusterIP Service can reach it — the
          # loopback-only hardening from Stage 1 existed solely to force
          # traffic through the now-removed sidecar.
          command: ["uvicorn"]
          args:
            - sandbox_router:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          # Restore the router's own probes (Stage 1 removed them because the
          # kubelet couldn't reach a 127.0.0.1 listener; now it can).
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
