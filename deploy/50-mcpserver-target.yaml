# Registers the broker as an MCP-server target on the sandbox gateway.
#
# - gatewayId pins OUR gateway (aio-sandbox-gateway), overriding the operator's
#   default GATEWAY_ID env (which points at the unrelated alphavantage gateway).
# - oauthProviderArn = the sandbox-realm credential provider; the operator wires
#   it as CLIENT_CREDENTIALS (the only grant the CRD/operator supports).
# - privateEndpoint lets the Gateway reach the broker's INTERNAL ALB.
# - allowed*Headers propagate Mcp-Session-Id both ways so the BROKER can manage
#   MCP sessions itself (this API's Gateway has no sessionConfiguration).
apiVersion: mcpgateway.bedrock.aws/v1alpha1
kind: MCPServer
metadata:
  name: aio-sandbox-broker
  namespace: default
spec:
  description: AIO Sandbox broker (lifecycle + MCP forwarding to the router)
  # Convention (per keycloak project docs + alphavantage target): the endpoint
  # is the bare host and the MCP server serves at the ROOT path. The broker
  # mounts its MCP handler at "/" accordingly.
  endpoint: https://broker.jicomusic.com
  gatewayId: aio-sandbox-gateway-qgj2drbxed
  authType: OAuth2
  oauthProviderArn: arn:aws:bedrock-agentcore:us-west-2:820537372947:token-vault/default/oauth2credentialprovider/sandbox-gateway-outbound
  oauthScopes:
    - openid
    - sandbox
  capabilities:
    - tools
  allowedRequestHeaders:
    - Mcp-Session-Id
  allowedResponseHeaders:
    - Mcp-Session-Id
  privateEndpoint:
    endpointIpAddressType: IPV4
    vpcId: vpc-05b391f8b1b35136c
    subnetIds:
      - subnet-01536f21a50770a91
      - subnet-015aeb44672752825
      - subnet-08f12cb97d95c50ae
    securityGroupIds:
      - sg-013767868a1151374
