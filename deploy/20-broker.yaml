# Broker: Streamable HTTP MCP server behind agentgateway.
#
# agentgateway validates the inbound Keycloak user JWT and forwards that token
# (backendAuth: passthrough) to this broker, which re-validates it as a
# resource server, enforces the sandbox-users group, claims a sandbox, and
# forwards MCP to the ClusterIP router. No oauth2-proxy sidecar; no AWS gateway.
#
# Apply:
#   kubectl apply -f 20-broker.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: aio-sandbox-broker-config
  namespace: default
  labels:
    app: aio-sandbox-broker
data:
  AIO_TEMPLATE_NAME: aio-sandbox-template
  AIO_NAMESPACE: default
  AIO_WARMPOOL: aio-sandbox-warmpool
  AIO_TTL_SECONDS: "3600"
  # In-cluster router (ClusterIP-only, no sidecar).
  AIO_ROUTER_URL: "http://sandbox-router-svc.default.svc.cluster.local.:8080"
  # OAuth2 resource-server validation of the passed-through user JWT.
  AIO_OIDC_ISSUER: "https://keycloak.example.com/realms/sandbox"
  AIO_EXPECTED_AUDIENCE: "sandbox-router"
  # agentgateway passthrough: the token is the user's own, minted by the
  # public login client. Per-user identity + group gate enforced here.
  AIO_GATEWAY_AZP: "aio-sandbox-client"
  AIO_REQUIRED_GROUP: "sandbox-users"
  # Per-user concurrent-sandbox cap (the create gate). The broker is the only
  # component that can create claims, so this can't be bypassed by opening more
  # MCP sessions. 0 disables the cap.
  AIO_MAX_SANDBOXES_PER_USER: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aio-sandbox-broker
  namespace: default
  labels:
    app: aio-sandbox-broker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aio-sandbox-broker
  template:
    metadata:
      labels:
        app: aio-sandbox-broker
      annotations:
        # Don't let Karpenter drain the broker during node consolidation.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: aio-sandbox-broker
      dnsConfig:
        options:
          - { name: ndots, value: "3" }
      containers:
        - name: broker
          # Replace with your own registry/namespace (see README "Build & push the broker image").
          image: your-registry/aio-sandbox-broker:0.4.1
          envFrom:
            - configMapRef:
                name: aio-sandbox-broker-config
          ports:
            - { name: http, containerPort: 8080 }
          # Tolerant probe timings (5s timeout / 6 failures) leave headroom on
          # a single-worker uvicorn under load; /healthz itself is trivial.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: aio-sandbox-broker-svc
  namespace: default
spec:
  selector:
    app: aio-sandbox-broker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
