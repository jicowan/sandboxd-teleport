# The broker, fronted by an oauth2-proxy sidecar — the same pattern the
# sandbox-router uses. The broker binds to 127.0.0.1 so only the sidecar
# can reach it; the sidecar validates the Keycloak JWT and forwards the
# caller identity in X-Auth-Request-* headers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aio-sandbox-broker
  namespace: default
  labels:
    app: aio-sandbox-broker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aio-sandbox-broker
  template:
    metadata:
      labels:
        app: aio-sandbox-broker
    spec:
      serviceAccountName: aio-sandbox-broker
      containers:
        - name: broker
          image: jicowan/aio-sandbox-broker:latest
          command: ["uvicorn"]
          args:
            - broker:app
            - --host
            - 127.0.0.1          # loopback only; sidecar is the front door
            - --port
            - "8080"
          env:
            - { name: AIO_TEMPLATE_NAME, value: aio-sandbox-template }
            - { name: AIO_NAMESPACE,     value: default }
            - { name: AIO_WARMPOOL,      value: aio-sandbox-warmpool }
            - { name: AIO_TTL_SECONDS,   value: "3600" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }

        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8080
            - --reverse-proxy=true
            - --skip-jwt-bearer-tokens=true
            - --extra-jwt-issuers=https://keycloak.jicomusic.com/realms/sandbox=sandbox-router
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.jicomusic.com/realms/sandbox
            - --client-id=aio-sandbox-client
            - --client-secret=unused
            - --email-domain=*
            # Authorization gate: a valid token is not enough — the caller
            # must be in the sandbox-users Keycloak group (emitted as a
            # `groups` claim by the sandbox client scope's group mapper).
            - --allowed-group=sandbox-users
            - --pass-authorization-header=true
            # The broker reads X-Auth-Request-Email to identify the caller.
            # Our Keycloak users may not have an `email` claim, so source the
            # identity from `preferred_username` instead (always present).
            - --oidc-email-claim=preferred_username
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-cookie
                  key: secret
          ports:
            - { name: http-auth, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: 4180 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: aio-sandbox-broker-svc
  namespace: default
spec:
  selector:
    app: aio-sandbox-broker
  ports:
    - name: http
      port: 8080          # external port; targets the sidecar
      targetPort: 4180
