# agentgateway (standalone) — the MCP front door.
#
#   client (user JWT) -> agentgateway (validate inbound JWT against Keycloak,
#                          inject X-Sandbox-App per route)
#     -> backendAuth passthrough (forward the SAME user JWT)
#     -> broker (re-validates JWT, reads preferred_username/groups, resolves the
#                app + enforces its group, derives a per-user+app session id)
#     -> sandbox-router -> sandbox (runs the app's MCP server)
#
# Standalone mode: a single Deployment reading config.yaml from a ConfigMap.
# MULTI-APP: one route per app (/aio/mcp, /everything/mcp) selects the app; there
# is no catch-all "/mcp" route. Per-user identity reaches the broker with no
# OBO/3LO/consent (backendAuth: passthrough).
#
# NOTE: the backend target uses the broker's Service DNS name. If the cluster's
# CoreDNS is flaky, agentgateway's connect may time out — stabilize DNS rather
# than pinning a ClusterIP (which is not stable across Service recreation).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: default
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    # MULTI-APP front door (docs/PRD-broker-multi-app.md). Per app: a data-path route
    # (/aio/mcp, /everything/mcp) that injects X-Sandbox-App and proxies to the broker,
    # PLUS an explicit well-known route so RFC 9728 OAuth discovery
    # (/.well-known/oauth-protected-resource/<app>/mcp) returns THAT app's resource.
    # There is no catch-all "/" route, so discovery is unambiguous per app.
    binds:
    - port: 3000
      listeners:
      - protocol: HTTP
        routes:
        # ---- OAuth protected-resource discovery, per app (must precede data routes) ----
        - name: aio-wellknown
          matches: [{ path: { pathPrefix: /.well-known/oauth-protected-resource/aio } }]
          policies:
            mcpAuthentication:
              mode: strict
              issuer: https://keycloak.example.com/realms/sandbox
              audiences: [sandbox-router]
              jwks: { url: https://keycloak.example.com/realms/sandbox/protocol/openid-connect/certs }
              provider: { keycloak: {} }
              resourceMetadata:
                resource: https://agentgateway.example.com/aio/mcp
                authorization_servers: [https://keycloak.example.com/realms/sandbox]
                scopesSupported: [openid, sandbox]
                bearerMethodsSupported: [header]
            backendAuth: { passthrough: {} }
          backends:
          - mcp: { targets: [{ name: aio-broker, mcp: { host: http://aio-sandbox-broker-svc.default.svc.cluster.local.:8080/ } }] }
        - name: everything-wellknown
          matches: [{ path: { pathPrefix: /.well-known/oauth-protected-resource/everything } }]
          policies:
            mcpAuthentication:
              mode: strict
              issuer: https://keycloak.example.com/realms/sandbox
              audiences: [sandbox-router]
              jwks: { url: https://keycloak.example.com/realms/sandbox/protocol/openid-connect/certs }
              provider: { keycloak: {} }
              resourceMetadata:
                resource: https://agentgateway.example.com/everything/mcp
                authorization_servers: [https://keycloak.example.com/realms/sandbox]
                scopesSupported: [openid, sandbox]
                bearerMethodsSupported: [header]
            backendAuth: { passthrough: {} }
          backends:
          - mcp: { targets: [{ name: aio-broker, mcp: { host: http://aio-sandbox-broker-svc.default.svc.cluster.local.:8080/ } }] }
        # ---- App: AIO (data path /aio/mcp) ----
        - name: aio-route
          matches: [{ path: { pathPrefix: /aio } }]
          policies:
            mcpAuthentication:
              mode: strict
              issuer: https://keycloak.example.com/realms/sandbox
              audiences: [sandbox-router]
              jwks: { url: https://keycloak.example.com/realms/sandbox/protocol/openid-connect/certs }
              provider: { keycloak: {} }
              resourceMetadata:
                resource: https://agentgateway.example.com/aio/mcp
                authorization_servers: [https://keycloak.example.com/realms/sandbox]
                scopesSupported: [openid, sandbox]
                bearerMethodsSupported: [header]
            backendAuth: { passthrough: {} }
            requestHeaderModifier: { set: { X-Sandbox-App: aio } }
            mcpAuthorization:
              rules:
              - '"sandbox-power" in jwt.groups'
              - 'mcp.tool.name.startsWith("browser_")'
              - 'mcp.tool.name == "sandbox_file_operations"'
              - 'mcp.tool.name == "sandbox_str_replace_editor"'
              - 'mcp.tool.name == "sandbox_convert_to_markdown"'
              - 'mcp.tool.name == "sandbox_get_context"'
              - 'mcp.tool.name == "sandbox_get_packages"'
              - 'mcp.tool.name == "sandbox_load_skill"'
          backends:
          - mcp: { targets: [{ name: aio-broker, mcp: { host: http://aio-sandbox-broker-svc.default.svc.cluster.local.:8080/ } }] }
        # ---- App: everything (data path /everything/mcp) ----
        - name: everything-route
          matches: [{ path: { pathPrefix: /everything } }]
          policies:
            mcpAuthentication:
              mode: strict
              issuer: https://keycloak.example.com/realms/sandbox
              audiences: [sandbox-router]
              jwks: { url: https://keycloak.example.com/realms/sandbox/protocol/openid-connect/certs }
              provider: { keycloak: {} }
              resourceMetadata:
                resource: https://agentgateway.example.com/everything/mcp
                authorization_servers: [https://keycloak.example.com/realms/sandbox]
                scopesSupported: [openid, sandbox]
                bearerMethodsSupported: [header]
            backendAuth: { passthrough: {} }
            requestHeaderModifier: { set: { X-Sandbox-App: everything } }
            mcpAuthorization:
              rules:
              - '"sandbox-power" in jwt.groups'
          backends:
          - mcp: { targets: [{ name: aio-broker, mcp: { host: http://aio-sandbox-broker-svc.default.svc.cluster.local.:8080/ } }] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: default
  labels: { app: agentgateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: agentgateway }
  template:
    metadata:
      labels: { app: agentgateway }
      annotations: { karpenter.sh/do-not-disrupt: "true" }
    spec:
      dnsConfig:
        options:
          - { name: ndots, value: "3" }
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.3.1
          args: ["-f", "/etc/agentgateway/config.yaml"]
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: cfg, mountPath: /etc/agentgateway }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
      volumes:
        - name: cfg
          configMap: { name: agentgateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-svc
  namespace: default
spec:
  selector: { app: agentgateway }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }

