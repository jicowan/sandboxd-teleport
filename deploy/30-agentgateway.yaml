# agentgateway (standalone) — the MCP front door.
#
#   client (user JWT) -> agentgateway (validate inbound JWT against Keycloak)
#     -> backendAuth passthrough (forward the SAME user JWT)
#     -> broker (re-validates JWT, reads preferred_username/groups, claims sandbox)
#     -> sandbox-router -> AIO pod
#
# Standalone mode: a single Deployment reading config.yaml from a ConfigMap.
# Per-user identity reaches the broker with no OBO/3LO/consent (see
# docs/POSTMORTEM-agentcore-vs-agentgateway.md).
#
# NOTE: the backend target uses the broker's Service DNS name. If the cluster's
# CoreDNS is flaky, agentgateway's connect may time out — stabilize DNS rather
# than pinning a ClusterIP (which is not stable across Service recreation).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: default
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    binds:
    - port: 3000
      listeners:
      - protocol: HTTP
        routes:
        - name: mcp-route
          matches:
          - path: { pathPrefix: / }
          policies:
            mcpAuthentication:
              mode: strict
              issuer: https://keycloak.jicomusic.com/realms/sandbox
              audiences: [sandbox-router]
              jwks:
                url: https://keycloak.jicomusic.com/realms/sandbox/protocol/openid-connect/certs
              provider:
                keycloak: {}
              resourceMetadata:
                resource: https://agentgateway.jicomusic.com/mcp
                # Point clients at Keycloak as the OAuth authorization server
                # (RFC 9728). Without this, agentgateway defaults authorization_servers
                # to the resource URL, and Claude Code's discovery fails.
                authorization_servers:
                  - https://keycloak.jicomusic.com/realms/sandbox
                scopesSupported: [openid, sandbox]
                bearerMethodsSupported: [header]
            # Forward the validated user JWT unchanged to the broker.
            backendAuth:
              passthrough: {}
            # Tool-level authorization (tiered by Keycloak group claim in the
            # passed-through JWT). Rules are OR'd: a tool call is allowed if ANY
            # rule matches. Unauthorized tools are ALSO filtered out of the
            # tools/list response, so standard users never see exec tools.
            #
            # Tiers:
            #   - sandbox-power : everything (incl. shell + code execution)
            #   - sandbox-users : browser_* + non-exec sandbox_* (files, editor,
            #                     markdown, context, packages, skill loader);
            #                     NOT sandbox_execute_bash / sandbox_execute_code
            #
            # mcp.tool.name is the bare tool name (e.g. "sandbox_execute_bash")
            # as published by the AIO hub and passed through by the broker.
            mcpAuthorization:
              rules:
              # Power users: any tool.
              - '"sandbox-power" in jwt.groups'
              # Standard users: web browsing.
              - 'mcp.tool.name.startsWith("browser_")'
              # Standard users: non-exec sandbox tools.
              - 'mcp.tool.name == "sandbox_file_operations"'
              - 'mcp.tool.name == "sandbox_str_replace_editor"'
              - 'mcp.tool.name == "sandbox_convert_to_markdown"'
              - 'mcp.tool.name == "sandbox_get_context"'
              - 'mcp.tool.name == "sandbox_get_packages"'
              - 'mcp.tool.name == "sandbox_load_skill"'
              # NOTE: sandbox_execute_bash and sandbox_execute_code are
              # intentionally NOT listed here, so only sandbox-power may call
              # (or even see) them.
          backends:
          - mcp:
              targets:
              - name: aio-broker
                mcp:
                  host: http://aio-sandbox-broker-svc.default.svc.cluster.local.:8080/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: default
  labels: { app: agentgateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: agentgateway }
  template:
    metadata:
      labels: { app: agentgateway }
      annotations: { karpenter.sh/do-not-disrupt: "true" }
    spec:
      dnsConfig:
        options:
          - { name: ndots, value: "3" }
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.3.1
          args: ["-f", "/etc/agentgateway/config.yaml"]
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: cfg, mountPath: /etc/agentgateway }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
      volumes:
        - name: cfg
          configMap: { name: agentgateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-svc
  namespace: default
spec:
  selector: { app: agentgateway }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
