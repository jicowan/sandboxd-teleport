# RL environment as an AppTemplate — the WORKLOAD half of a sandbox (no scheduling).
#
# This is a deliberately tiny, stock-image "environment server" so the example runs
# with NOTHING to build or push: a python:3.12-slim image with the env written inline
# as its command. A real environment (a coding-agent gym, a browser task, a
# game/simulator) is the same shape — swap `image`/`cmd` for your env server; the
# ForkSet mechanics below are identical.
#
# The env exposes a minimal HTTP step/reset/state API (the interface an RL trainer
# drives — observe -> act -> reward -> transition, per
# https://northflank.com/blog/reinforcement-learning-agents-in-secure-sandboxes):
#   GET  /state           -> {"step": N, "sum": S, "boot": "<uuid>"}   (observation)
#   POST /step  {"a": <int>}  -> {"step": N+1, "sum": S+a, "reward": r} (transition)
#   POST /reset           -> zeroes step/sum (per-episode reset to a baseline)
#   GET  /healthz         -> 200  (worker readiness probe target)
#
# State (step/sum) lives in the process — so it survives within an episode and is
# captured by a checkpoint, which is exactly what makes fork-from-snapshot work: the
# `sum` reached before the snapshot is present in every fork. `boot` is a per-process
# UUID printed once at start; it lets you SEE fork behavior — snapshot forks share the
# base's boot id (identical frozen state), app forks each have a distinct one
# (independently initialized).
apiVersion: core.sandboxd.io/v1alpha1
kind: AppTemplate
metadata:
  name: rl-env
  namespace: default
spec:
  image: docker.io/library/python:3.12-slim
  # The whole env server, inline — no image to build. Reads/writes only process state.
  cmd:
    - python
    - -c
    - |
      import json, os, uuid
      from http.server import BaseHTTPRequestHandler, HTTPServer
      BOOT = str(uuid.uuid4())          # per-process id: distinguishes forks
      S = {"step": 0, "sum": 0}         # in-RAM episode state (checkpointed with the sandbox)
      class H(BaseHTTPRequestHandler):
          def _send(self, code, obj):
              b = json.dumps(obj).encode()
              self.send_response(code); self.send_header("Content-Type","application/json")
              self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
          def do_GET(self):
              if self.path == "/healthz": return self._send(200, {"ok": True})
              if self.path == "/state":   return self._send(200, {**S, "boot": BOOT})
              self._send(404, {"error": "not found"})
          def do_POST(self):
              n = int(self.headers.get("Content-Length", 0) or 0)
              body = json.loads(self.rfile.read(n) or b"{}")
              if self.path == "/reset":
                  S["step"] = 0; S["sum"] = 0
                  return self._send(200, {**S, "boot": BOOT})
              if self.path == "/step":
                  a = int(body.get("a", 1))
                  S["step"] += 1; S["sum"] += a
                  return self._send(200, {**S, "reward": a, "boot": BOOT})
              self._send(404, {"error": "not found"})
          def log_message(self, *a): pass
      print(f"rl-env up boot={BOOT} on :8080", flush=True)
      HTTPServer(("0.0.0.0", 8080), H).serve_forever()
  ports: [{ container: 8080, host: 8080 }]
  health: { probe: http, probePort: 8080, probePath: /healthz }
  # RL default: an ephemeral rollout is torn down on idle leaving NO snapshot behind,
  # so K rollouts don't litter S3. A ForkSet can override this per fork (see 20-…).
  idle: { timeoutSeconds: 300, action: reset }
