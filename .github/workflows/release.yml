name: Release

# Build the operator/router/worker binaries (+ runsc).
#   push to main  -> build binaries (CI smoke: they compile)
#   push tag v*   -> also publish a GitHub Release with the binaries + runsc attached
#
# Container images are NOT built here — build/push them on demand with the
# "Images" workflow (.github/workflows/images.yml) or locally via `make images`.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

env:
  RUNSC_VERSION: release-20260622.0
  RUNSC_ARCH: x86_64

jobs:
  build-binaries:
    name: Build binaries + runsc
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/attach GitHub Release on tags
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: checkpoint-restore/controlplane/go.mod

      - name: Build operator + router (controlplane module)
        working-directory: checkpoint-restore/controlplane
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o "${GITHUB_WORKSPACE}/dist/operator" ./cmd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o "${GITHUB_WORKSPACE}/dist/router" ./cmd/router

      - name: Build worker (sandboxd module)
        working-directory: checkpoint-restore/sandboxd
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -o "${GITHUB_WORKSPACE}/dist/sandboxd" ./

      - name: Fetch pinned runsc
        run: |
          # gVisor's release bucket is keyed by the bare date, not the full tag.
          RUNSC_DATE="$(echo "${RUNSC_VERSION}" | sed -E 's/release-([0-9]+).*/\1/')"
          curl -fsSL -o dist/runsc \
            "https://storage.googleapis.com/gvisor/releases/release/${RUNSC_DATE}/${RUNSC_ARCH}/runsc"
          chmod +x dist/runsc

      - name: Upload binaries as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Attach binaries to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.4.1
        with:
          files: |
            dist/operator
            dist/router
            dist/sandboxd
            dist/runsc
